services:
  solr:
    image: solr:9-slim
    ports:
      - "8983:8983"
    networks: [ search ]
    environment:
      ZK_HOST: "zoo:2181"
      SOLR_HEAP: "1g"
    depends_on: [ zoo ]
    volumes:
      - data:/var/solr
      - ./mydata:/mydata
      - ./init-solr.sh:/init-solr.sh
    command: [ "bash", "/init-solr.sh" ]

  zoo:
    image: zookeeper:3.9
    networks: [ search ]
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: "mntr,conf,ruok"

    # =============================================================================
    # LGTM Stack - Grafana observability backend (Loki, Grafana, Tempo, Mimir)
    # =============================================================================
    # This all-in-one container provides:
    # - Loki: Log aggregation (LogQL queries)
    # - Grafana: Visualization at http://localhost:3000 (no auth required)
    # - Tempo: Distributed tracing (TraceQL queries)
    # - Mimir: Prometheus-compatible metrics storage
    # - OpenTelemetry Collector: Receives OTLP data on ports 4317 (gRPC) and 4318 (HTTP)
    #
    # Spring Boot auto-configures OTLP endpoints when this container is running.
  lgtm:
      image: grafana/otel-lgtm:latest
      ports:
          - "3000:3000"   # Grafana UI
          - "4317:4317"   # OTLP gRPC receiver
          - "4318:4318"   # OTLP HTTP receiver
      networks: [ search ]
      labels:
          # Prevent Spring Boot auto-configuration from trying to manage this service
          org.springframework.boot.ignore: "true"

  # =============================================================================
  # Keycloak - the identity provider the http profile authenticates against
  # =============================================================================
  # Started only by the http profile, which sets spring.docker.compose.enabled=true. The realm is
  # imported from keycloak/solr-mcp-realm.json, so the clients and — critically — the audience
  # protocol mapper exist before the server ever asks for a token.
  #
  # The mapper is what makes tokens acceptable here. Keycloak does not honour the RFC 8707
  # `resource=` parameter, so without it a token is issued normally and then rejected by
  # validateAudienceClaim(true) with a 401. See docs/security/keycloak.md.
  #
  # The healthcheck is not decoration: the server resolves the issuer at startup and fails to boot
  # if the realm is not yet answering, so Spring Boot must wait for this container to be healthy
  # before the application context starts. Keycloak's image ships neither curl nor wget, hence
  # bash's /dev/tcp.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - "8180:8080"
    networks: [ search ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    command: [ "start-dev", "--import-realm" ]
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  data:

networks:
  search:
    driver: bridge
