# ============================================================================
# Secret scan
# ============================================================================
#
# Runs gitleaks over the commits a pull request adds (base..head), so a key
# committed on a branch is caught before it reaches main. Existing history is
# not rescanned.
#
# gitleaks/gitleaks-action is not on the ASF Actions allow-list, so the job
# downloads the release binary and verifies it against the SHA-256 published in
# that release's gitleaks_<version>_checksums.txt. To upgrade, change both env
# values together.
# ============================================================================

name: Secret Scan

on:
    pull_request:
        branches:
            - main

concurrency:
    group: secret-scan-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest
        timeout-minutes: 10

        env:
            GITLEAKS_VERSION: 8.30.1
            GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0
                    persist-credentials: false

            -   name: Install gitleaks
                run: |
                    curl -sSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
                        "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
                    echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
                    tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

            -   name: Scan the pull request's commits
                env:
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                run: |
                    "$RUNNER_TEMP/gitleaks" git . \
                        --redact \
                        --verbose \
                        --log-opts="--no-merges ${BASE_SHA}..${HEAD_SHA}"
