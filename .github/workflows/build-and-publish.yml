# ╔═══════════════════════════════════════════════════════════════════════════╗
# ║                    CONTINUOUS DEPLOYMENT WORKFLOW                          ║
# ║                           (Development Builds)                             ║
# ╚═══════════════════════════════════════════════════════════════════════════╝
#
# PURPOSE: Automated development build + test (incl. Solr-version matrix) on main
#
# WHEN TO USE:
# -----------
# ✅ Automatic build + test on every merge to main
# ✅ Solr-version compatibility checks
# ℹ️  Does not publish images; official ASF releases use release-publish.yml
#
# COMPARISON WITH OTHER WORKFLOWS:
# --------------------------------
# build-and-publish.yml (THIS FILE):
#   - Purpose: Development CI (build + test)
#   - Trigger: Automatic (push to main)
#   - Publishes: No (build + test only)
#   - ASF Vote: Not required
#   - Use for: Daily development work
#
# release-publish.yml:
#   - Purpose: Official ASF releases
#   - Trigger: Manual (after vote)
#   - Docker Hub: apache/solr-mcp
#   - ASF Vote: Required (72 hours)
#   - Use for: Production releases
#
# nightly-build.yml:
#   - Purpose: Nightly builds
#   - Trigger: Scheduled (2 AM UTC)
#   - Docker Hub: apache/solr-mcp-nightly
#   - Use for: Latest unstable builds
#
# atr-release.yml:
#   - Purpose: Future ATR automation
#   - Trigger: Manual (after prerequisites)
#   - Status: Blocked (needs automated signing)
#   - Use for: When ATR is ready
#
# ────────────────────────────────────────────────────────────────────────────
#
# GitHub Actions Workflow: Build and Test
# ========================================
#
# This workflow builds the Solr MCP Server project and runs its test suite,
# including the Solr-version compatibility matrix. It does not publish any
# artifacts — image/release publishing (when needed) is handled separately.
#
# Workflow Triggers:
# ------------------
# 1. Push to 'main' branch - Builds and tests
# 2. Manual trigger via workflow_dispatch
#
# Note: Pull request validation is handled by ci.yml. Release artifact
# publishing is handled by release-publish.yml.
#
# Jobs:
# -----
# 1. build: Compiles the JAR, runs tests, and uploads artifacts
# 2. solr-compatibility: Runs the test suite across supported Solr versions

name: Build and Test

# Triggers for this workflow
# - push: runs on commits to main
# - workflow_dispatch: allows manual execution from the Actions UI
# Pull request validation is handled separately by ci.yml
on:
    push:
        branches:
            - main            # Build + test on main merges
    workflow_dispatch:        # Manual runs for maintainers

jobs:
    # ============================================================================
    # Job 1: Build JAR
    # ============================================================================
    # This job compiles the project, runs tests, and generates build artifacts.
    # It runs on all triggers (push, PR, tags, manual).
    #
    # Outputs:
    # - Spring Boot JAR with all dependencies (fat JAR)
    # - Plain JAR without dependencies
    # - JUnit test results
    # - JaCoCo code coverage reports
    # ============================================================================
    build:
        name: Build JAR
        runs-on: ubuntu-latest

        steps:
            # Checkout the repository code
            -   name: Checkout code
                uses: actions/checkout@v4

            # Set up Java environment using centralized configuration
            # See .github/actions/setup-java/action.yml to update Java version
            -   name: Set up Java
                uses: ./.github/actions/setup-java

            # Build the project with Gradle
            # This runs: compilation, tests, spotless formatting, error-prone checks,
            # JaCoCo coverage, and creates the JAR files
            -   name: Build with Gradle
                run: ./gradlew build

            # Upload the compiled JAR files as workflow artifacts
            # These can be downloaded from the GitHub Actions UI
            # Artifacts are retained for 7 days
            -   name: Upload JAR artifact
                uses: actions/upload-artifact@v4
                with:
                    name: solr-mcp-jar
                    path: build/libs/solr-mcp-*.jar
                    retention-days: 7

            # Upload the CycloneDX SBOM produced during the build
            # build/reports/application.cdx.json is generated by the cyclonedx
            # Gradle plugin and is also embedded in the bootable JAR. Retained
            # for 30 days (longer than the standard 7) because supply-chain
            # investigations often happen well after a build.
            -   name: Upload SBOM artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: solr-mcp-sbom
                    path: build/reports/application.cdx.json
                    retention-days: 30

            # Upload JUnit test results
            # if: always() ensures this runs even if the build fails
            # This allows viewing test results for failed builds
            -   name: Upload test results
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: test-results
                    path: build/test-results/
                    retention-days: 7

            # Upload JaCoCo code coverage report
            # if: always() ensures this runs even if tests fail
            # Coverage reports help identify untested code paths
            -   name: Upload coverage report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: coverage-report
                    path: build/reports/jacoco/
                    retention-days: 7

    # ============================================================================
    # Job 2: Solr Version Compatibility Tests
    # ============================================================================
    # Tests the server against multiple Solr versions using Testcontainers.
    # Runs in parallel so each Solr version is an independent job.
    # Tested versions: 8.11, 9.4, 9.9, 9.10, 10
    # ============================================================================
    solr-compatibility:
        name: Solr ${{ matrix.solr-version }} Compatibility
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                solr-version:
                    - "8.11-slim"
                    - "9.4-slim"
                    - "9.9-slim"
                    - "9.10-slim"
                    - "10-slim"

        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Set up Java
                uses: ./.github/actions/setup-java

            -   name: Run tests against Solr ${{ matrix.solr-version }}
                env:
                    SOLR_VERSION: ${{ matrix.solr-version }}
                run: ./gradlew test "-Dsolr.test.image=solr:${SOLR_VERSION}"
