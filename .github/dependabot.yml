# Dependabot: security alerts and weekly version-bump PRs for the Gradle build.
#
# Scope is the root build and its version catalog (gradle/libs.versions.toml). Each bump is
# an ordinary PR, so ci.yml runs on it and a committer reviews and merges it as usual.
#
# Not covered here, on purpose:
#   - GitHub Actions: ASF Infra only allows actions on its allow-list
#     (apache/infrastructure-actions), so a bump to an unlisted version fails to start.
#   - buildSrc pins: cyclonedx-core-java must stay on the version the org.cyclonedx.bom plugin
#     uses (buildSrc/build.gradle.kts), so it is ignored below and bumped with the plugin.

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for all minor and patch bumps; majors arrive one per PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "org.cyclonedx:cyclonedx-core-java"
