spring.main.web-application-type=none
# NOTE: You must disable the banner and the console logging
# to allow the STDIO transport to work !!!
spring.main.banner-mode=off
# Do NOT set logging.pattern.console= (empty) here as a "second line of defence".
# Spring Boot copies it into the JVM-wide CONSOLE_LOG_PATTERN system property
# (first writer wins) and logback rejects an empty pattern outright, so it does
# not silence anything - it breaks any http-profile context started later in
# the same JVM, which Spring Framework 7's test-context pausing makes routine.
# STDIO stays silent because logback-spring.xml declares no appenders for it.
spring.ai.mcp.server.stdio=true
spring.autoconfigure.exclude=\
  org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration
# Docker Compose integration is only useful in HTTP mode for local development.
# Disable it in STDIO mode to avoid startup delays and unexpected container management.
spring.docker.compose.enabled=false
