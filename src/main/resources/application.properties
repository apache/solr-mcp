spring.application.name=solr-mcp
spring.profiles.active=${PROFILES:stdio}
spring.ai.mcp.server.instructions=This server provides tools to search, index, and manage Apache Solr collections. \
Discover before acting: use list-collections and get-schema to see what exists before searching or indexing. \
For data at an http(s) URL, prefer index-url; for a file on the user's machine, tell the user to run \
bin/solr post or curl against Solr's /update handler; use the inline indexing tools only for small pasted data. \
Surface boundaries: there are no tools to delete documents or collections, drop or alter existing fields, \
or debug relevance scoring (debugQuery); vector/KNN search is not exposed; search facets are simple field \
facets only (no range, pivot, or JSON facets). Schema modification is additive only via add-fields and \
add-field-types; changing an existing field's type requires reindexing and is not supported by this server.
# index-url: which hosts may be fetched (exact host, *.suffix, or * for any), the
# connect, per-read and whole-fetch timeouts, and how many fetches may run at once.
# There is no size limit: JSON, CSV and XML stream into Solr, Markdown is read whole.
# Link-local addresses and the known cloud-metadata addresses (AWS, Alibaba Cloud,
# Azure) are refused regardless of the allow-list.
solr.index-url.allowed-hosts=raw.githubusercontent.com,*.githubusercontent.com,github.com
solr.index-url.connect-timeout=10s
solr.index-url.read-timeout=30s
solr.index-url.total-timeout=5m
solr.index-url.max-concurrent-fetches=4
spring.ai.mcp.server.name=${spring.application.name}
spring.ai.mcp.server.version=1.0.0
# Solr configuration
solr.url=${SOLR_URL:http://localhost:8983/solr/}
# Enable virtual threads for improved concurrency
spring.threads.virtual.enabled=true
