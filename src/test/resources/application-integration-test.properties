# Profile for the opt-in LLM evals (./gradlew eval). The agent uses Spring AI's
# OpenAI defaults and reads its key from OPENAI_API_KEY, so it is not configured here.

# The eval context runs Spring AI's auto-configuration for its ChatClient and MCP
# client; without this it would also start an MCP STDIO server on the test JVM's
# stdin and stdout.
spring.ai.mcp.server.enabled=false

# solr-mcp under test: the built jar (passed by the eval task), on the test JVM's
# own Java, against the Testcontainers Solr (solr.url, set by TestcontainersConfiguration).
spring.ai.mcp.client.stdio.connections.solr-mcp.command=${java.home}/bin/java
spring.ai.mcp.client.stdio.connections.solr-mcp.args=-jar,${solr.mcp.jar}
spring.ai.mcp.client.stdio.connections.solr-mcp.env[SOLR_URL]=${solr.url}
spring.ai.mcp.client.stdio.connections.solr-mcp.env[SPRING_DOCKER_COMPOSE_ENABLED]=false
